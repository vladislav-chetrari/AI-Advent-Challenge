name: support-index

# Копировать в целевой репозиторий как .github/workflows/support-index.yml
# Task 3 (День 33): CRM ассистента поддержки = Issues этого репозитория.
# Ночью (и по кнопке) Action выгружает тикеты на VPS: сервер разбирает
# front-matter, раскладывает их в CRM и кладёт в тот же RAG-индекс, что и FAQ.
#
# Без этого шага бот знает только документацию; с ним — ещё и живые обращения
# пользователей со статусами, ответственными и обходными путями.
#
# Ключ LLM здесь не нужен: индексация эмбеддингами Ollama на VPS, генерация — только
# в /support/ask, ключ прилетает per-request в X-LLM-Key.

on:
  schedule:
    # 03:47 UTC — позже index-docs (03:17), чтобы доки индексировались первыми.
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Имя проекта в RAG на VPS (по умолчанию — имя репозитория)'
        required: false
      state:
        description: 'Какие тикеты выгружать: all | open'
        required: false
        default: 'all'
        type: choice
        options: [all, open]

permissions:
  contents: read
  issues: read

concurrency:
  group: support-index
  cancel-in-progress: false

jobs:
  crm:
    runs-on: ubuntu-latest
    # Индексация тикетов дольше обычного HTTP-запроса, но короче полной индексации доков.
    timeout-minutes: 45
    steps:
      - name: Export tickets from Issues and push to VPS CRM
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PROJECT: ${{ inputs.project || vars.REVIEW_PROJECT || github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          TICKET_STATE: ${{ inputs.state || 'all' }}
          # Дополнительно можно сузить выгрузку до лейбла, например: support
          TICKET_LABEL: ${{ vars.TICKET_LABEL || 'support' }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error, urllib.parse

          base = os.environ.get('VPS_URL', '').strip()
          if not base.startswith(('http://', 'https://')):
              print('FAIL: VPS_URL must start with http:// or https:// (scheme missing)', file=sys.stderr)
              raise SystemExit(1)
          host = urllib.parse.urlparse(base).netloc
          project = os.environ.get('REVIEW_PROJECT') or None
          repo = os.environ['REPO_FULL']
          api = 'https://api.github.com'
          print('crm project:', project, '| host:', host, '| state:', os.environ['TICKET_STATE'])

          def gh(path, params):
              url = api + path + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          label = os.environ.get('TICKET_LABEL', '').strip()
          params = {
              'state': 'all' if os.environ['TICKET_STATE'] == 'all' else 'open',
              'per_page': 100,
          }
          if label:
              params['labels'] = label
          items = gh(f'/repos/{repo}/issues', params)

          issues = []
          skipped = 0
          for it in items:
              # В /issues попадают и PR — у них поле pull_request.
              if 'pull_request' in it:
                  skipped += 1
                  continue
              issues.append({
                  'number': it['number'],
                  'title': it['title'],
                  'body': it.get('body') or '',
                  'state': it['state'],
                  'labels': [l['name'] for l in it.get('labels') or []],
                  'assignees': [a['login'] for a in it.get('assignees') or []],
                  'createdAt': it['created_at'],
                  'updatedAt': it['updated_at'],
                  'url': it['html_url'],
              })
          print(f'tickets found: {len(issues)} (skipped PRs: {skipped})')
          if not issues:
              print('FAIL: ни одного тикета не нашлось — проверь лейбл TICKET_LABEL и issues:read', file=sys.stderr)
              raise SystemExit(1)
          for i in issues:
              print(f"  #{i['number']} [{i['state']}] {','.join(i['labels']) or '-'} — {i['title'][:60]}")

          payload = json.dumps({'project': project, 'issues': issues}).encode()
          req = urllib.request.Request(
              base.rstrip('/') + '/crm/import', data=payload, method='POST',
              headers={'Content-Type': 'application/json',
                       'Authorization': 'Bearer ' + os.environ.get('VPS_TOKEN', '')},
          )
          try:
              body = urllib.request.urlopen(req, timeout=2400).read()
          except urllib.error.HTTPError as e:
              print(f'FAIL: VPS HTTP {e.code}: {e.read().decode(errors="replace")[:600]}', file=sys.stderr)
              raise SystemExit(1)
          except urllib.error.URLError as e:
              print(f'FAIL: cannot reach VPS host {host}: {e.reason}', file=sys.stderr)
              raise SystemExit(1)
          print('crm import ok:', body.decode(errors='replace')[:1200])
          EOF