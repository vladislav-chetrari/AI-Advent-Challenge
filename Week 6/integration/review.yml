name: ai-review

# Копировать в целевой репозиторий как .github/workflows/ai-review.yml
# Ревьюит PR через VPS движок Week 6: шлёт diff на $VPS_URL, постит inline-комменты.
# Настройка — 3 секрета + 1 переменная (см. integration/README.md).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Номер PR для ручного ревью'
        required: false

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch base
        run: git fetch origin ${{ github.event.pull_request.base.ref || 'main' }} --depth=50 || true

      # Diff base...HEAD (только изменения ветки PR), лимит ~100 КБ под контекст LLM.
      - name: Request review from VPS
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_TOKEN: ${{ secrets.VPS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_PROJECT: ${{ vars.REVIEW_PROJECT || github.event.repository.name }}
          REPO_URL: ${{ format('{0}/{1}', github.server_url, github.repository) }}
          # Токен для приватных репозиториев: сервер использует его только чтобы
          # склонировать/подтянуть доки (в памяти, не хранится). Для публичных — пусто.
          REPO_TOKEN: ${{ github.event.repository.private && secrets.GITHUB_TOKEN || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git diff --unified=3 --no-color "origin/$BASE_REF...HEAD" > /tmp/pr.diff \
            || git diff --unified=3 --no-color > /tmp/pr.diff
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error, urllib.parse

          # VPS_URL — секрет, поэтому GitHub маскирует его целиком в логах.
          # Поэтому печатаем только схему и host (без схемы) — так видна причина ошибки.
          base = os.environ.get('VPS_URL', '').strip()
          if not base.startswith(('http://', 'https://')):
              print('FAIL: VPS_URL must start with http:// or https:// (scheme missing)', file=sys.stderr)
              raise SystemExit(1)
          host = urllib.parse.urlparse(base).netloc
          print('review endpoint host:', host, '| scheme:', base.split(':')[0], '| private repo token:',
                'yes' if os.environ.get('REPO_TOKEN') else 'no')

          diff = open('/tmp/pr.diff', encoding='utf-8', errors='replace').read()[:100000]
          if not diff.strip():
              open('review.json', 'w').write(json.dumps({"summary": "Нет изменений — ревью нечего.", "comments": []}))
              print('empty diff, skipping VPS')
              raise SystemExit(0)
          payload = json.dumps({
              "diff": diff,
              "project": os.environ.get('REVIEW_PROJECT') or None,
              # Сервер сам склонирует доки при первом обращении и подтянет при следующих.
              "repoUrl": os.environ.get('REPO_URL') or None,
              "repoToken": os.environ.get('REPO_TOKEN') or None,
              "maxFiles": 15,
              "refresh": True,
          }).encode()
          req = urllib.request.Request(
              base.rstrip('/') + '/review', data=payload, method='POST',
              headers={'Content-Type': 'application/json',
                       'Authorization': 'Bearer ' + os.environ.get('VPS_TOKEN', ''),
                       # Ключ летит per-request из GH Secrets, на VPS не хранится.
                       'X-LLM-Key': os.environ.get('DEEPSEEK_API_KEY', '')},
          )
          try:
              body = urllib.request.urlopen(req, timeout=600).read()
          except urllib.error.HTTPError as e:
              print(f'FAIL: VPS HTTP {e.code}: {e.read().decode(errors="replace")[:600]}', file=sys.stderr)
              raise SystemExit(1)
          except urllib.error.URLError as e:
              # Чаще всего: порт закрыт файрволом GCP или сервер не запущен.
              print(f'FAIL: cannot reach VPS host {host}: {e.reason}', file=sys.stderr)
              raise SystemExit(1)
          open('review.json', 'wb').write(body)
          print('VPS review ok, bytes:', len(body))
          EOF

      - name: Post inline comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_FILE: review.json
        run: python3 .github/scripts/post_review.py
