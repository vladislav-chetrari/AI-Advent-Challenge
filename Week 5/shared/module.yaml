product:
  type: kmp/lib
  platforms: [jvm, android]

dependencies:
  - $compose.foundation: exported
  - $compose.material3: exported
  - org.jetbrains.compose.material:material-icons-core:1.7.3: exported
  - $compose.runtime: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0
  - org.jetbrains.kotlinx:kotlinx-serialization-core:1.11.0
  # Koog: облачный путь DeepSeek едет через prompt-executor-deepseek-client
  # (DSL промпта + транспорт + сериализация). Ktor CIO — дефолтный движок
  # для KoogHttpClient на JVM/Android.
  # NB: Maven-группа ai.koog (в доках Gradle-нотация ai.koog.prompt),
  # deepseek-клиент на Central пока только beta (stable нет).
  - ai.koog:prompt-executor-deepseek-client:1.3.0-beta
  - io.ktor:ktor-client-core:3.1.3
  - io.ktor:ktor-client-cio:3.1.3
  # Room KMP: рантайм и драйвер видны потребителям (билдер БД создают
  # платформенные entry-point'ы: MainActivity / desktop main).
  - androidx.room:room-runtime:2.8.5: exported
  - androidx.sqlite:sqlite-bundled:2.7.1: exported

# Платформенные рантаймы: LiteRT-LM отдельно под Android (AAR)
# и под JVM-десктоп (jar с нативами). Общий код их не видит —
# только src@android / src@jvm actuals.
dependencies@android:
  - com.google.ai.edge.litertlm:litertlm-android:0.18.0

dependencies@jvm:
  - com.google.ai.edge.litertlm:litertlm-jvm:0.18.0

settings:
  compose:
    enabled: true
  kotlin:
    serialization: json
    ksp:
      processors:
        - androidx.room:room-compiler:2.8.5
