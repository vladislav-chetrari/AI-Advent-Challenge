product:
  type: kmp/lib
  platforms: [jvm, android]

dependencies:
  - $compose.foundation: exported
  - $compose.material3: exported
  - $libs.material.icons.core: exported
  - $compose.runtime: exported
  - $libs.coroutines.core
  - $libs.serialization.json
  - $libs.serialization.core
  # Koog: облачный путь DeepSeek едет через prompt-executor-deepseek-client
  # (DSL промпта + транспорт + сериализация). Ktor CIO — дефолтный движок
  # для KoogHttpClient на JVM/Android.
  # NB: Maven-группа ai.koog (в доках Gradle-нотация ai.koog.prompt),
  # deepseek-клиент на Central пока только beta (stable нет).
  - $libs.koog.deepseek.client
  # KoogHttpClient.Factory для рантайма: без этого модуля дефолтная фабрика
  # не находится через ServiceLoader и DeepSeek падает с
  # "No KoogHttpClient.Factory provider found" (проверено на устройстве).
  - $libs.koog.http.ktor
  - $libs.ktor.client.core
  - $libs.ktor.client.cio
  # Room KMP: рантайм и драйвер видны потребителям (билдер БД создают
  # платформенные entry-point'ы: MainActivity / desktop main).
  - $libs.room.runtime: exported
  - $libs.sqlite.bundled: exported

# Платформенные рантаймы: LiteRT-LM отдельно под Android (AAR)
# и под JVM-десктоп (jar с нативами). Общий код их не видит —
# только src@android / src@jvm actuals.
dependencies@android:
  - $libs.litertlm.android

dependencies@jvm:
  - $libs.litertlm.jvm

settings:
  compose:
    enabled: true
  kotlin:
    serialization: json
    ksp:
      processors:
        - $libs.room.compiler
